<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white pelican with a long orange bill and throat pouch sits on the saddle of a teal bicycle, wings on the handlebar and webbed feet on the pedals.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5e7f8"/>
      <stop offset="58%" stop-color="#eaf6fd"/>
      <stop offset="100%" stop-color="#fff3e4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c2"/>
      <stop offset="60%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc15a"/>
      <stop offset="50%" stop-color="#f39222"/>
      <stop offset="100%" stop-color="#e06f10"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b0"/>
      <stop offset="100%" stop-color="#f2a84e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dccc8"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffcf8"/>
      <stop offset="100%" stop-color="#f3ece2"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#16324a" flood-opacity="0.14"/>
    </filter>
  </defs>

